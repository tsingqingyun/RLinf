# RoboCasa v1.0.0 ("365") environment config.
# RoboCasa v1.0 source: default /home/njc/robocasa; override with export ROBOCASA365_PATH=...
# (v1.0.0 requires mujoco==3.3.1, numpy==2.2.5)
#
# Differences from robocasa v0.2.0 config:
#   env_type: robocasa365
#   split: controls layout/style/object generalisation split
#   layout_ids / style_ids: fix specific scene configurations
#   camera 256x256 (was 224), 3views (was 2views)

env_type: robocasa365

robot_name: PandaOmron

task_names:
  - CloseDrawer
  # v1.0.0 新增的 atomic 任务可以直接加在这里，例如：
  # - OpenCabinet
  # - CloseCabinet
  # - OpenMicrowave
  # - CloseMicrowave
  # - OpenFridge
  # - CloseFridge
  # composite 任务也是直接用注册名，例如：
  # - PrepareCoffee
  # - ThawInSink

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 300
max_episode_steps: 300
use_fixed_reset_state_ids: False
use_ordered_reset_state_ids: False

use_rel_reward: True
reward_coef: 1.0
is_eval: False

seed: 42
group_size: 1

# ── v1.0.0 新增参数 ──────────────────────────────────────────────
# split: 控制 layout/style/object 的泛化 split
#   null     → 完全随机（等价于旧版行为）
#   "all"    → 所有 layout + style 组合
#   "pretrain" → 训练用的 layout/style/object 子集
#   "target"   → 评估用的固定 10 个 layout+style 组合
split: null

# layout_ids / style_ids: 固定特定场景（split 非 null 时会覆盖这里）
# 单个 int: 固定到某个 id
# list: 从列表里随机选
# null: 完全随机
layout_ids: null
style_ids: null

# obj_instance_split: 物体实例级泛化
#   null / "pretrain" / "target"
obj_instance_split: null

# generative_textures: 使用随机贴图的概率 (0.0~1.0)，null 表示不使用
generative_textures: null

# randomize_cameras: 是否每个 episode 随机抖动相机位姿
randomize_cameras: false
# ────────────────────────────────────────────────────────────────

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  camera_heights: 256   # v1.0.0 默认分辨率（旧版是 224）
  camera_widths: 256

action_space: 12d
state_space: 25d
image_space: 3views     # v1.0.0 新增了 agentview_right；改成 2views 可向后兼容
