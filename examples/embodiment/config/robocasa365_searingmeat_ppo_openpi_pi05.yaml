defaults:
  - env/robocasa365_searingmeat@env.train
  - env/robocasa365_searingmeat@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# 面向 8×A800 80GB；显存仍有余量时可提高 batch / rollout_epoch / total_num_envs 吃满算力。
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa365_searingmeat_ppo_openpi_pi05"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  # Run periodic evaluation during training so you can monitor `eval/success_once`.
  # (With val_check_interval <= 0, evaluation is disabled.)
  val_check_interval: 20
  save_interval: 20

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  # 每轮环境采样轮数；提高则单步收集更多 transition（更吃显存/吞吐）
  rollout_epoch: 8
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  # P1：每批 rollout 只过 1 遍，减轻对稀疏奖励数据的过拟合
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  # P0：锚定预训练策略，缓解长 horizon 下的策略崩溃
  kl_beta: 0.02
  entropy_bonus: 0
  # P1：收紧 trust region
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    # 须能被 env 进程数整除（8 卡时常用 8/16/32/64）。显存充足时可开到 32 加速采样
    total_num_envs: 32
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2900
    group_size: ${algorithm.group_size}
    reward_coef: ${algorithm.reward_coef}
    split: null
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    # 若 val_check_interval>0 或 only_eval，同样须能被 env 进程数整除
    total_num_envs: 32
    auto_reset: True
    # End episodes on success during eval (faster + clearer success-rate metric).
    ignore_terminations: False
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2900
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    split: null
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: robocasa
  # 80GB 上可常驻 GPU，减少 offload 往返；若 OOM 再改为 True
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:REPO_PATH}/checkpoints/pi05_robocasa_mixed_dataset_test-from_pretrained-pytorch
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 8 卡 FSDP：需 global % (micro×8)==0 且 rollout 展平后样本数 % (global/8)==0
  micro_batch_size: 16
  global_batch_size: 640
  seed: 42
  # Actor 模型要训练，常驻 GPU；不要卸到 CPU（否则 CPU RAM 暴增）
  enable_offload: False

  model:
    model_path: ${oc.env:REPO_PATH}/checkpoints/pi05_robocasa_mixed_dataset_test-from_pretrained-pytorch
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 5
    action_dim: 32
    add_value_head: True
    openpi:
      # RLinf 仅注册 pi05_robocasa_human；权重由 model_path 加载（mixed 微调 checkpoint）
      config_name: "pi05_robocasa_human"
      action_env_dim: 12
      num_images_in_input: 3
      detach_critic_input: True
      joint_logprob: False
      value_after_vlm: True

    openpi_data:
        action_space: ${env.train.action_space}
        state_space: ${env.train.state_space}
        image_space: ${env.train.image_space}

    policy_setup: ${env.train.action_space}

  optim:
    # P0：预训练微调用更小 lr，减缓遗忘
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    # P1：抑制梯度尖峰
    clip_grad: 0.5
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
