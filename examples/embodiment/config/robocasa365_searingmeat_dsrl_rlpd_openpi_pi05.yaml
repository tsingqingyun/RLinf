# Robocasa365 + DSRL SAC + RLPD：在 robocasa365_searingmeat_dsrl_sac_openpi_pi05 基础上增加 demo_buffer
# 需将 offline 演示轨迹整理为 RLinf TrajectoryReplayBuffer 可 load 的目录（与 realworld RLPD 相同格式）
#
#   export EMBODIED_PATH="/path/to/RLinf/examples/embodiment"
#   python train_embodied_agent.py --config-name robocasa365_searingmeat_dsrl_rlpd_openpi_pi05 \
#     algorithm.demo_buffer.load_path=/你的/demo/checkpoint目录
#
# 若暂无 demo，请用 robocasa365_searingmeat_dsrl_sac_openpi_pi05（纯 SAC + 在线 replay）
defaults:
  - env/robocasa365_searingmeat@env.train
  - env/robocasa365_searingmeat@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa365_searingmeat_dsrl_rlpd_openpi_pi05"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 20

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 50
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  agg_q: mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1

  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 2000
    sample_window_size: 2000
    min_buffer_size: 4
    auto_save: False

  demo_buffer:
    enable_cache: True
    cache_size: 500
    min_buffer_size: 1
    sample_window_size: 500
    load_path: "/path/to/demo_data"
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 4
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2900
    group_size: ${algorithm.group_size}
    reward_coef: ${algorithm.reward_coef}
    split: null
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2900
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    split: null
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: robocasa
  enable_offload: True
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/cephfs/shared/kzl/_robocasa_checkpoints/pi05_robocasa_mixed_dataset_test-from_pretrained-pytorch"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 128
  seed: 42
  enable_offload: False

  model:
    model_path: "/cephfs/shared/kzl/_robocasa_checkpoints/pi05_robocasa_mixed_dataset_test-from_pretrained-pytorch"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 5
    action_dim: 32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"

    openpi:
      config_name: "pi05_robocasa_human"
      action_env_dim: 12
      num_images_in_input: 3
      use_dsrl: True
      dsrl_state_dim: 25
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims: [128, 128, 128]
      train_expert_only: True
      detach_critic_input: True
      noise_method: "reinflow"

    openpi_data:
      action_space: ${env.train.action_space}
      state_space: ${env.train.state_space}
      image_space: ${env.train.image_space}

    policy_setup: ${env.train.action_space}

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5

  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
