# GRPO（Group Relative Policy Optimization）：advantage 在组内相对归一化，loss 为 actor-only（无 value loss）
# 要求 algorithm.group_size > 1，且需满足 validate_embodied_cfg：
#   (env.train.total_num_envs // env_world_size // rollout.pipeline_stage_num) % group_size == 0
#
# 内存：Robocasa + 多并行 MuJoCo 子进程极易触发 OOM（cgroup / Ray 节点 100GB 阈值）。
# 省内存：少 env、小 batch、fsdp gradient_checkpointing、训练关 save_video。若 env_world_size=4，total_num_envs=4
# 不满足整除时请改回 8（group_size=2）或 16（group_size=8）等。
defaults:
  - env/robocasa365_searingmeat@env.train
  - env/robocasa365_searingmeat@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa365_searingmeat_grpo_openpi_pi05"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 20

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  # 与 total_num_envs=4 搭配：1～2 卡 env 时 (N//ws)%2==0；四卡 env 请把 total_num_envs 改回 ≥8
  group_size: 2
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.05
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    # 8→4：进一步减 MuJoCo 子进程与 Ray RSS；与 group_size=2 配套（四卡 env 见文件头说明）
    total_num_envs: 4
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2900
    group_size: ${algorithm.group_size}
    reward_coef: ${algorithm.reward_coef}
    split: null
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2900
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    split: null
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: robocasa
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/cephfs/shared/kzl/_robocasa_checkpoints/pi05_robocasa_mixed_dataset_test-from_pretrained-pytorch"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  # 需满足 global_batch_size % (micro_batch_size * actor_world_size) == 0；16 在 1～4 卡 actor 上可整除
  global_batch_size: 16
  seed: 42
  enable_offload: False

  model:
    model_path: "/cephfs/shared/kzl/_robocasa_checkpoints/pi05_robocasa_mixed_dataset_test-from_pretrained-pytorch"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 5
    action_dim: 32
    add_value_head: False
    openpi:
      config_name: "pi05_robocasa_human"
      action_env_dim: 12
      num_images_in_input: 3
      detach_critic_input: True
      joint_logprob: False
      value_after_vlm: False

    openpi_data:
      action_space: ${env.train.action_space}
      state_space: ${env.train.state_space}
      image_space: ${env.train.image_space}

    policy_setup: ${env.train.action_space}

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
